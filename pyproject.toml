[project]
name = "anticassiopeia"
version = "0.1.0"
description = "A verification engine: confirmed / contradicted / undetermined."
license = "MPL-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
    # Pinned lower bounds verified against what's actually installed and
    # tested in this build's real environment (2026-10-25): pypdf 6.19.0,
    # python-docx 1.2.0 (pulls in lxml), python-multipart 0.0.32. The
    # above lower bounds are intentionally looser than that -- the exact
    # versions tested, not a floor nothing older could possibly satisfy.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anticassiopeia*"]
